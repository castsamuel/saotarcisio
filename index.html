<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escala do Coroinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth.js/1.6.0/mammoth.browser.min.js"></script>
<style>
  :root{
    --red-deep:#A6192E;
    --red-garnet:#5E0F1F;
    --red-garnet-2:#7A1626;
    --gold:#C9A227;
    --ivory:#FBF9F5;
    --blush:#F5E9E6;
    --blush-2:#EDD9D4;
    --ink:#2B1210;
    --ink-soft:#7A5C57;
    --line:#E7D9D5;
    --white:#FFFFFF;
    --radius-card:18px;
    --shadow-soft: 0 8px 24px -12px rgba(94,15,31,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{
    font-family:'Fraunces',serif;
    letter-spacing:-0.01em;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- NAV ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(251,249,245,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1080px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand svg{width:26px;height:26px;flex-shrink:0;}
  .brand-text{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;color:var(--red-garnet);}
  .navlinks{display:flex;gap:4px;}
  .navlink{
    padding:8px 14px;border-radius:999px;font-size:0.92rem;font-weight:500;
    color:var(--ink-soft);transition:background .15s, color .15s;
    white-space:nowrap;
  }
  .navlink:hover{background:var(--blush);color:var(--ink);}
  .navlink.active{background:var(--red-garnet);color:var(--white);}
  .hamburger{display:none;background:none;border:none;padding:8px;}
  .hamburger svg{width:22px;height:22px;color:var(--red-garnet);}
  .mobile-menu{display:none;flex-direction:column;padding:8px 20px 16px;gap:4px;}
  .mobile-menu.open{display:flex;}
  @media (max-width:760px){
    .navlinks{display:none;}
    .hamburger{display:block;}
  }

  /* ---------- LAYOUT ---------- */
  .page{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}
  .page-title{font-size:1.5rem;font-weight:600;margin:0 0 4px;}
  .page-sub{color:var(--ink-soft);font-size:0.94rem;margin:0 0 28px;}
  .grid-dash{display:grid;grid-template-columns:1.15fr 0.85fr;gap:22px;align-items:start;}
  @media (max-width:840px){.grid-dash{grid-template-columns:1fr;}}

  /* ---------- HERO ARCH CARD ---------- */
  .arch-card{
    background:linear-gradient(180deg,var(--red-garnet-2) 0%, var(--red-garnet) 100%);
    color:var(--ivory);
    border-radius:160px 160px 20px 20px;
    padding:56px 34px 34px;
    text-align:center;
    position:relative;
    box-shadow: var(--shadow-soft);
    overflow:hidden;
  }
  .arch-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,transparent, var(--gold), transparent);
  }
  .arch-icon{
    width:34px;height:34px;margin:0 auto 14px;color:var(--gold);opacity:0.9;
  }
  .arch-eyebrow{font-size:0.72rem;letter-spacing:0.14em;color:var(--gold);font-weight:600;margin-bottom:10px;}
  .arch-date{font-family:'Fraunces',serif;font-size:1.55rem;font-weight:600;margin:0 0 6px;}
  .arch-time{font-size:1.6rem;font-weight:700;margin:0 0 4px;}
  .arch-func{font-size:1.02rem;color:#F0D9D3;margin:0 0 18px;}
  .arch-countdown{
    display:inline-block;background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    padding:8px 18px;border-radius:999px;font-size:0.88rem;font-weight:500;
  }
  .arch-empty{font-size:1.05rem;color:#F0D9D3;padding:20px 0 6px;}

  /* ---------- QUOTE CARD ---------- */
  .quote-card{
    margin-top:20px;
    background:var(--white);
    border:1px solid var(--line);
    border-left:3px solid var(--gold);
    border-radius:14px;
    padding:20px 22px;
  }
  .quote-text{font-family:'Fraunces',serif;font-style:italic;font-size:1.02rem;line-height:1.5;color:var(--ink);margin:0 0 8px;}
  .quote-attr{font-size:0.8rem;color:var(--ink-soft);}

  /* ---------- GENERIC CARD / LIST ---------- */
  .card{
    background:var(--white);border:1px solid var(--line);
    border-radius:var(--radius-card);padding:20px;
  }
  .card+.card{margin-top:14px;}
  .card-title{font-size:1rem;font-weight:600;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;}
  .link-quiet{color:var(--red-deep);font-size:0.85rem;font-weight:500;}

  .event-row{
    display:flex;align-items:flex-start;gap:14px;
    padding:14px 0;border-top:1px solid var(--line);
  }
  .event-row:first-child{border-top:none;padding-top:0;}
  .event-date-chip{
    flex-shrink:0;width:52px;text-align:center;
    background:var(--blush);border-radius:12px;padding:8px 4px;
  }
  .event-date-chip .d{font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem;color:var(--red-garnet);line-height:1;}
  .event-date-chip .m{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);}
  .event-main{flex:1;min-width:0;}
  .event-func{font-weight:600;font-size:0.95rem;}
  .event-meta{font-size:0.83rem;color:var(--ink-soft);margin-top:2px;}
  .badge{
    display:inline-block;font-size:0.68rem;font-weight:600;padding:2px 8px;
    border-radius:999px;margin-left:8px;letter-spacing:0.02em;
  }
  .badge-manual{background:var(--blush-2);color:var(--red-garnet);}
  .badge-importado{background:#E7EEE0;color:#4B6B33;}
  .badge-warn{background:#FBEAC2;color:#8A6300;}
  .empty-state{
    text-align:center;padding:40px 20px;color:var(--ink-soft);
  }
  .empty-state svg{width:38px;height:38px;color:var(--blush-2);margin-bottom:10px;}

  /* ---------- FORMS ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;color:var(--ink);}
  .field .hint{font-size:0.76rem;color:var(--ink-soft);margin-top:4px;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:0.92rem;background:var(--ivory);color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--red-deep);background:var(--white);
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){.field-row{grid-template-columns:1fr;}}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;border-radius:999px;border:none;font-size:0.92rem;font-weight:600;
    transition:transform .1s, background .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--red-deep);color:var(--white);}
  .btn-primary:hover{background:var(--red-garnet);}
  .btn-ghost{background:var(--blush);color:var(--red-garnet);}
  .btn-ghost:hover{background:var(--blush-2);}
  .btn-text{background:none;color:var(--ink-soft);padding:8px 10px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}

  /* ---------- FILTER PILLS ---------- */
  .pillbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .pill{
    padding:7px 15px;border-radius:999px;font-size:0.84rem;font-weight:500;
    background:var(--white);border:1px solid var(--line);color:var(--ink-soft);
  }
  .pill.active{background:var(--red-garnet);color:var(--white);border-color:var(--red-garnet);}

  /* ---------- IMPORT FLOW ---------- */
  .dropzone{
    border:2px dashed var(--blush-2);border-radius:18px;padding:44px 20px;text-align:center;
    background:var(--white);cursor:pointer;transition:border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--red-deep);background:var(--blush);}
  .dropzone svg{width:36px;height:36px;color:var(--red-deep);margin-bottom:12px;}
  .dropzone .dz-title{font-weight:600;margin-bottom:4px;}
  .dropzone .dz-sub{font-size:0.83rem;color:var(--ink-soft);}
  .steps{display:flex;gap:6px;margin-bottom:26px;}
  .step-dot{flex:1;height:4px;border-radius:4px;background:var(--line);}
  .step-dot.done{background:var(--red-deep);}
  .spinner{
    width:34px;height:34px;border-radius:50%;border:3px solid var(--blush-2);
    border-top-color:var(--red-deep);animation:spin 0.8s linear infinite;margin:0 auto 16px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .review-item{
    border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--white);
  }
  .review-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .review-head input[type=checkbox]{width:18px;height:18px;accent-color:var(--red-deep);}
  .review-head .rh-name{font-weight:600;flex:1;}
  .review-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  @media (max-width:640px){.review-grid{grid-template-columns:1fr 1fr;}}
  .mini-field label{font-size:0.72rem;color:var(--ink-soft);display:block;margin-bottom:3px;}
  .mini-field input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:0.85rem;background:var(--ivory);}
  .warn-line{font-size:0.76rem;color:#8A6300;margin-top:8px;display:flex;align-items:center;gap:5px;}
  .banner{
    background:var(--blush);border:1px solid var(--blush-2);border-radius:14px;
    padding:14px 16px;font-size:0.88rem;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .banner-err{background:#FDEEEE;border-color:#F3C9C9;color:#8A2323;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--white);padding:12px 20px;border-radius:999px;
    font-size:0.85rem;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,0.2);
  }
  .settings-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;}
  .settings-row .field{flex:1;min-width:200px;margin-bottom:0;}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ================= CROSS ICON / SVG HELPERS ================= */
const ICONS = {
  cross: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M7 8h10" stroke-linecap="round"/></svg>`,
  flame: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2c1 3-3 4-3 8a3 3 0 006 0c0-1.5-1-2-1-3.5 2 1 3.5 3.5 3.5 6a5.5 5.5 0 11-11 0C6.5 8 9 5 12 2z" stroke-linejoin="round"/></svg>`,
  calendar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18" stroke-linecap="round"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>`,
  upload: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M6 10l6-6 6 6M4 20h16" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z" stroke-linejoin="round"/></svg>`,
  list: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke-linecap="round"/></svg>`,
  menu: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>`,
  empty: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M9 15h6" stroke-linecap="round"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};

/* ================= STATE ================= */
const state = {
  page: 'inicio',
  menuOpen: false,
  perfil: { nome: '' },
  eventos: [],
  apiKey: '',
  loaded: false,
  toast: null,
  calFiltro: 'proximos',
  calOrdem: 'data',
  importFlow: { step: 'upload', fileName: '', rawText: '', extracted: [], erro: null, processando: false }
};

/* ================= STORAGE (localStorage - site estático) ================= */
async function loadData(){
  try{
    const p = localStorage.getItem('coroinha_perfil');
    if(p) state.perfil = JSON.parse(p);
  }catch(e){ /* no perfil yet */ }
  try{
    const ev = localStorage.getItem('coroinha_eventos');
    if(ev) state.eventos = JSON.parse(ev);
  }catch(e){ /* no eventos yet */ }
  try{
    const k = localStorage.getItem('coroinha_api_key');
    if(k) state.apiKey = k;
  }catch(e){ /* sem chave salva */ }
  state.loaded = true;
  render();
}
async function savePerfil(){
  try{ localStorage.setItem('coroinha_perfil', JSON.stringify(state.perfil)); }
  catch(e){ showToast('Não foi possível salvar o perfil agora.'); }
}
async function saveEventos(){
  try{ localStorage.setItem('coroinha_eventos', JSON.stringify(state.eventos)); }
  catch(e){ showToast('Não foi possível salvar os eventos agora.'); }
}
function salvarApiKey(valor){
  state.apiKey = valor.trim();
  try{
    if(state.apiKey) localStorage.setItem('coroinha_api_key', state.apiKey);
    else localStorage.removeItem('coroinha_api_key');
  }catch(e){}
}

/* ================= HELPERS ================= */
const DIAS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_FULL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function parseISODate(str){
  if(!str) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
  if(!m) return null;
  return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
}
function diaDaSemana(isoStr){
  const d = parseISODate(isoStr);
  if(!d) return null;
  return DIAS[d.getDay()];
}
function formatDiaMes(isoStr){
  const d = parseISODate(isoStr);
  if(!d) return {d:'--', m:'--'};
  return { d: String(d.getDate()).padStart(2,'0'), m: MESES[d.getMonth()] };
}
function formatDataLonga(isoStr){
  const d = parseISODate(isoStr);
  if(!d) return 'Data a confirmar';
  return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES_FULL[d.getMonth()]}`;
}
function hojeISO(){
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}
function uid(){ return 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

function eventoDataHora(ev){
  const d = parseISODate(ev.data);
  if(!d) return null;
  if(ev.horario){
    const [h,mi] = ev.horario.split(':').map(Number);
    d.setHours(h||0, mi||0, 0, 0);
  }
  return d;
}
function proximoEvento(){
  const agora = new Date();
  return state.eventos
    .filter(e => e.data)
    .map(e => ({ e, dt: eventoDataHora(e) }))
    .filter(x => x.dt && x.dt >= new Date(agora.getFullYear(),agora.getMonth(),agora.getDate()))
    .sort((a,b) => a.dt - b.dt)[0];
}
function contagemRegressiva(dt){
  const diffMs = dt - new Date();
  if(diffMs <= 0) return 'é hoje';
  const dias = Math.floor(diffMs / 86400000);
  const horas = Math.floor((diffMs % 86400000) / 3600000);
  if(dias === 0) return horas <= 1 ? 'em menos de 1 hora' : `faltam ${horas} horas`;
  if(dias === 1) return 'falta 1 dia';
  return `faltam ${dias} dias`;
}
function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 3200);
}
function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= NAV ================= */
const NAV_ITEMS = [
  {id:'inicio', label:'Início'},
  {id:'minhaescala', label:'Minha Escala'},
  {id:'calendario', label:'Calendário'},
  {id:'adicionar', label:'Adicionar Evento'},
  {id:'importar', label:'Importar Escala'}
];
function goTo(page){
  state.page = page;
  state.menuOpen = false;
  window.scrollTo(0,0);
  render();
}

function renderTopbar(){
  const links = NAV_ITEMS.map(it => `
    <a class="navlink ${state.page===it.id?'active':''}" onclick="goTo('${it.id}')">${it.label}</a>
  `).join('');
  return `
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">${ICONS.cross}<span class="brand-text">Escala do Coroinha</span></div>
      <div class="navlinks">${links}</div>
      <button class="hamburger" onclick="toggleMenu()">${ICONS.menu}</button>
    </div>
    <div class="mobile-menu ${state.menuOpen?'open':''}">${links}</div>
  </div>`;
}
function toggleMenu(){ state.menuOpen = !state.menuOpen; render(); }

/* ================= PAGE: INÍCIO ================= */
function renderInicio(){
  const prox = proximoEvento();
  const upcoming = state.eventos
    .filter(e=>e.data)
    .map(e=>({e,dt:eventoDataHora(e)}))
    .filter(x=>x.dt && x.dt >= new Date(new Date().setHours(0,0,0,0)))
    .sort((a,b)=>a.dt-b.dt)
    .slice(0,5);

  let heroHtml;
  if(prox){
    const e = prox.e;
    heroHtml = `
      <div class="arch-card">
        <div class="arch-icon">${ICONS.flame}</div>
        <div class="arch-eyebrow">PRÓXIMO SERVIÇO</div>
        <div class="arch-date">${formatDataLonga(e.data)}</div>
        <div class="arch-time">${e.horario ? e.horario : 'Horário a confirmar'}</div>
        <div class="arch-func">Função: ${e.funcao ? escapeHtml(e.funcao) : 'a confirmar'}${e.local?` · ${escapeHtml(e.local)}`:''}</div>
        <div class="arch-countdown">${contagemRegressiva(prox.dt)}</div>
      </div>`;
  } else {
    heroHtml = `
      <div class="arch-card">
        <div class="arch-icon">${ICONS.flame}</div>
        <div class="arch-eyebrow">PRÓXIMO SERVIÇO</div>
        <div class="arch-empty">Nenhum próximo serviço registrado.</div>
        <button class="btn btn-primary" style="margin-top:6px;" onclick="goTo('importar')">Importar escala</button>
      </div>`;
  }

  const listaHtml = upcoming.length ? upcoming.map(x=>renderEventRow(x.e)).join('') : `
    <div class="empty-state">${ICONS.empty}<div>Sem serviços futuros por enquanto.</div></div>`;

  const perfilBanner = !state.perfil.nome ? `
    <div class="banner">
      <span>Defina seu nome para que a IA encontre seus serviços na escala.</span>
      <button class="btn btn-ghost" onclick="goTo('minhaescala')">Definir nome</button>
    </div>` : '';

  return `
    <div class="page">
      ${perfilBanner}
      <div class="grid-dash">
        <div>
          ${heroHtml}
          <div class="quote-card">
            <p class="quote-text">"Antes morrer do que entregar o Corpo Santo de Jesus."</p>
            <div class="quote-attr">São Tarcísio, padroeiro dos coroinhas</div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Próximos serviços <a class="link-quiet" onclick="goTo('calendario')">ver todos</a></div>
          ${listaHtml}
        </div>

}

function renderEventRow(e){

    </div>`;
}

/* ================= PAGE: MINHA ESCALA ================= */

  const meus = state.eventos.slice().sort((a,b)=>{
    const da = a.data || '9999-99-99', db = b.data || '9999-99-99';
    return da.localeCompare(db);
  });
  const total = meus.length;
  const passados = meus.filter(e=>e.data && e.data < hojeISO()).length;
  const futuros = total - passados;

  return `
    <div class="page">
      <div class="page-title">Minha Escala</div>
      <div class="page-sub">Seu perfil e o resumo de todos os serviços já registrados.</div>

      <div class="card" style="margin-bottom:20px;">
        <div class="card-title">Meu nome</div>
        <div class="settings-row">
          <div class="field">
            <label>Nome como aparece na escala</label>
            <input id="input-nome" type="text" value="${escapeHtml(state.perfil.nome)}" placeholder="Ex.: João Pedro Silva">
            <div class="hint">Usado para localizar seus serviços automaticamente ao importar uma escala.</div>
          </div>
          <button class="btn btn-primary" onclick="salvarNome()">Salvar</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <div class="card-title">Chave de API da Anthropic (para a importação com IA)</div>
        <div class="settings-row">
          <div class="field">
            <label>Sua chave de API (começa com sk-ant-)</label>
            <input id="input-apikey" type="password" value="${escapeHtml(state.apiKey)}" placeholder="sk-ant-...">
            <div class="hint">Fica salva apenas no seu navegador (localStorage), nunca em um servidor. Como este é um site estático, a chave trafega diretamente do seu navegador até a Anthropic a cada importação — use uma chave só sua, de uso pessoal, e evite acessar este site em computadores públicos ou compartilhados. Você pode gerar uma em console.anthropic.com.</div>
          </div>
          <button class="btn btn-primary" onclick="salvarApiKeyForm()">Salvar chave</button>

      <div class="card" style="margin-bottom:20px;">
        <div class="card-title">Resumo</div>
        <div style="display:flex;gap:24px;flex-wrap:wrap;">
          <div><div style="font-family:'Fraunces',serif;font-size:1.6rem;font-weight:700;color:var(--red-garnet);">${total}</div><div class="event-meta">serviços no total</div></div>
          <div><div style="font-family:'Fraunces',serif;font-size:1.6rem;font-weight:700;color:var(--red-garnet);">${futuros}</div><div class="event-meta">próximos</div></div>
          <div><div style="font-family:'Fraunces',serif;font-size:1.6rem;font-weight:700;color:var(--red-garnet);">${passados}</div><div class="event-meta">já realizados</div></div>
        </div>

      </div>

      <div style="margin-top:24px;text-align:right;">

function salvarApiKeyForm(){
  const v = document.getElementById('input-apikey').value;
  salvarApiKey(v);
  showToast(v.trim() ? 'Chave salva neste navegador.' : 'Chave removida.');
}
function salvarNome(){
  const v = document.getElementById('input-nome').value.trim();
  state.perfil.nome = v;
  savePerfil();
  showToast(v ? 'Nome salvo.' : 'Nome removido.');
}
function confirmarLimpeza(){

    state.eventos = [];
    state.perfil = {nome:''};
    salvarApiKey('');
    saveEventos(); savePerfil();

}

/* ================= PAGE: CALENDÁRIO ================= */
function renderCalendario(){
  let lista = state.eventos.slice();
  const hoje = hojeISO();
  if(state.calFiltro === 'proximos') lista = lista.filter(e => !e.data || e.data >= hoje);
  if(state.calFiltro === 'passados') lista = lista.filter(e => e.data && e.data < hoje);

  if(state.calOrdem === 'data'){
    lista.sort((a,b)=>{
      const da = a.data || '9999-99-99', db = b.data || '9999-99-99';
      return state.calFiltro === 'passados' ? db.localeCompare(da) : da.localeCompare(db);
    });
  } else if(state.calOrdem === 'funcao'){
    lista.sort((a,b)=> (a.funcao||'').localeCompare(b.funcao||''));
  }

  const pill = (id,label) => `<button class="pill ${state.calFiltro===id?'active':''}" onclick="setCalFiltro('${id}')">${label}</button>`;

  return `
    <div class="page">
      <div class="page-title">Calendário</div>
      <div class="page-sub">Todos os seus serviços, organizados por data ou função.</div>

      <div class="pillbar">
        ${pill('proximos','Próximos')}
        ${pill('passados','Passados')}
        ${pill('todos','Todos')}
        <select onchange="setCalOrdem(this.value)" style="margin-left:auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:0.84rem;background:var(--white);">
          <option value="data" ${state.calOrdem==='data'?'selected':''}>Ordenar por data</option>
          <option value="funcao" ${state.calOrdem==='funcao'?'selected':''}>Ordenar por função</option>
        </select>
      </div>

      <div class="card">
        ${lista.length ? lista.map(e=>renderEventRowDeletable(e)).join('') : `<div class="empty-state">${ICONS.calendar}<div>Nenhum serviço nesta visualização.</div></div>`}
      </div>
    </div>`;
}
function setCalFiltro(f){ state.calFiltro = f; render(); }
function setCalOrdem(o){ state.calOrdem = o; render(); }

}

/* ================= PAGE: IMPORTAR ESCALA ================= */
function renderImportar(){
  const f = state.importFlow;
  const stepIndex = {upload:0, processando:1, revisao:2, concluido:3}[f.step];
  const dots = [0,1,2,3].map(i => `<div class="step-dot ${i<=stepIndex?'done':''}"></div>`).join('');

  let body = '';
  if(!state.perfil.nome || !state.apiKey){
    const faltando = !state.perfil.nome && !state.apiKey ? 'seu nome e uma chave de API' : (!state.perfil.nome ? 'seu nome' : 'uma chave de API');
    body = `
      <div class="banner">
        <span>Defina ${faltando} em "Minha Escala" antes de importar, para que a IA saiba quem procurar.</span>
        <button class="btn btn-ghost" onclick="goTo('minhaescala')">Configurar</button>
      </div>`;
  } else if(f.step === 'upload'){
    body = `
      <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
        ${ICONS.upload}
        <div class="dz-title">Envie o documento da escala</div>
        <div class="dz-sub">PDF, DOCX ou TXT — clique ou arraste o arquivo aqui</div>
      </div>
      <input type="file" id="file-input" accept=".pdf,.txt,.docx" style="display:none" onchange="onFileSelected(this.files[0])">
      ${f.erro ? `<div class="banner banner-err" style="margin-top:16px;">${escapeHtml(f.erro)}</div>` : ''}
    `;
  } else if(f.step === 'processando'){
    body = `
      <div class="card" style="text-align:center;padding:50px 20px;">
        <div class="spinner"></div>
        <div style="font-weight:600;">Lendo "${escapeHtml(f.fileName)}"...</div>
        <div class="event-meta" style="margin-top:6px;">A IA está interpretando a escala e procurando por "${escapeHtml(state.perfil.nome)}".</div>
      </div>`;
  } else if(f.step === 'revisao'){
    if(!f.extracted.length){
      body = `
        <div class="banner banner-err">
          Nenhuma ocorrência de "${escapeHtml(state.perfil.nome)}" foi encontrada com segurança neste documento. Verifique se o nome está escrito da mesma forma na escala, ou tente novamente.
        </div>
        <button class="btn btn-ghost" onclick="reiniciarImportacao()">Tentar novamente</button>`;
    } else {
      body = `
        <div class="page-sub" style="margin-bottom:16px;">Confira os serviços encontrados para "${escapeHtml(state.perfil.nome)}". Ajuste o que for preciso e desmarque o que não deve ser adicionado.</div>
        ${f.extracted.map((item,idx)=>renderReviewItem(item,idx)).join('')}
        <div style="display:flex;gap:10px;margin-top:10px;">
          <button class="btn btn-primary" onclick="confirmarImportacao()">Adicionar eventos selecionados</button>
          <button class="btn btn-text" onclick="reiniciarImportacao()">Cancelar</button>
        </div>`;
    }
  } else if(f.step === 'concluido'){
    body = `
      <div class="card" style="text-align:center;padding:40px 20px;">
        <div style="font-family:'Fraunces',serif;font-size:1.3rem;font-weight:600;margin-bottom:8px;">Escala importada</div>
        <div class="event-meta" style="margin-bottom:20px;">Seus serviços já aparecem no painel e no calendário.</div>
        <div style="display:flex;gap:10px;justify-content:center;">
          <button class="btn btn-primary" onclick="goTo('inicio')">Ver painel</button>
          <button class="btn btn-ghost" onclick="reiniciarImportacao()">Importar outra escala</button>
        </div>
      </div>`;
  }

  return `
    <div class="page">
      <div class="page-title">Importar Escala</div>
      <div class="page-sub">Envie o documento da coordenação pastoral e deixe a IA localizar seus serviços.</div>
      <div class="steps">${dots}</div>
      ${body}
    </div>`;
}

function renderReviewItem(item, idx){
  const warn = item.incompleto ? `<div class="warn-line">⚠ Alguns dados não foram encontrados com segurança — confirme antes de salvar.</div>` : '';
  return `
    <div class="review-item">
      <div class="review-head">
        <input type="checkbox" id="chk-${idx}" ${item.incluir!==false?'checked':''} onchange="toggleIncluir(${idx}, this.checked)">
        <div class="rh-name">${escapeHtml(item.funcao || 'Função não identificada')}</div>
      </div>
      <div class="review-grid">
        <div class="mini-field"><label>Data</label><input type="date" value="${item.data||''}" onchange="editarCampoRevisao(${idx},'data',this.value)"></div>
        <div class="mini-field"><label>Horário</label><input type="time" value="${item.horario||''}" onchange="editarCampoRevisao(${idx},'horario',this.value)"></div>
        <div class="mini-field"><label>Função</label><input type="text" value="${escapeHtml(item.funcao||'')}" onchange="editarCampoRevisao(${idx},'funcao',this.value)"></div>
        <div class="mini-field"><label>Local</label><input type="text" value="${escapeHtml(item.local||'')}" onchange="editarCampoRevisao(${idx},'local',this.value)"></div>
        <div class="mini-field"><label>Observações</label><input type="text" value="${escapeHtml(item.observacoes||'')}" onchange="editarCampoRevisao(${idx},'observacoes',this.value)"></div>
      </div>
      ${warn}
    </div>`;
}
function toggleIncluir(idx, checked){ state.importFlow.extracted[idx].incluir = checked; }
function editarCampoRevisao(idx, campo, valor){ state.importFlow.extracted[idx][campo] = valor; }

function reiniciarImportacao(){
  state.importFlow = { step:'upload', fileName:'', rawText:'', extracted:[], erro:null, processando:false };
  render();
}

async function onFileSelected(file){
  if(!file) return;
  state.importFlow.fileName = file.name;
  state.importFlow.erro = null;
  state.importFlow.step = 'processando';
  render();

  try{
    let texto = '';
    const ext = file.name.split('.').pop().toLowerCase();
    if(ext === 'pdf'){
      texto = await extrairTextoPDF(file);
    } else if(ext === 'docx'){
      texto = await extrairTextoDOCX(file);
    } else {
      texto = await file.text();
    }
    texto = (texto || '').trim();
    if(!texto){
      throw new Error('Não foi possível extrair texto deste arquivo.');
    }
    state.importFlow.rawText = texto;
    const extraidos = await interpretarEscalaComIA(texto, state.perfil.nome);
    state.importFlow.extracted = extraidos.map(x => ({...x, incluir: true}));
    state.importFlow.step = 'revisao';
  } catch(err){
    console.error(err);
    state.importFlow.erro = 'Não foi possível processar este arquivo (' + (err.message || 'erro desconhecido') + '). Tente novamente ou use outro formato.';
    state.importFlow.step = 'upload';
  }
  render();
}

async function extrairTextoPDF(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let full = '';
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    full += content.items.map(it => it.str).join(' ') + '\\n';
  }
  return full;
}
async function extrairTextoDOCX(file){
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({arrayBuffer: buf});
  return result.value;
}

async function interpretarEscalaComIA(texto, nome){
  const textoLimitado = texto.length > 12000 ? texto.slice(0,12000) : texto;
  const hoje = hojeISO();
  const systemPrompt = `Você recebe o texto bruto de uma escala de coroinhas de uma paróquia (pode conter tabelas mal formatadas pela extração).
Sua tarefa: encontrar TODAS as linhas/ocorrências em que a pessoa chamada "${nome}" está escalada (comparação sem diferenciar maiúsculas/minúsculas e acentos; aceite o nome aparecendo parcialmente, por exemplo só o primeiro e último nome, desde que seja claramente a mesma pessoa).
Para cada ocorrência, extraia: data do serviço, horário, função/cargo atribuído, local (se houver) e quaisquer observações relevantes.
Datas: converta para o formato ISO YYYY-MM-DD. Se o ano não estiver escrito, assuma o ano atual; se a data resultante já tiver passado há mais de 30 dias em relação a hoje (${hoje}), use o ano seguinte.
Nunca invente dados. Se um campo não puder ser identificado com segurança, use null nesse campo e marque "incompleto": true no item.
Responda APENAS com um JSON válido, sem markdown, sem comentários, no formato exato:
{"eventos":[{"data":"YYYY-MM-DD ou null","horario":"HH:MM ou null","funcao":"string ou null","local":"string ou null","observacoes":"string ou null","incompleto":true|false}]}
Se nenhuma ocorrência do nome for encontrada, responda {"eventos":[]}.`;

  if(!state.apiKey){
    throw new Error('Nenhuma chave de API configurada. Adicione sua chave da Anthropic em "Minha Escala".');
  }
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": state.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: systemPrompt,
      messages: [
        { role: "user", content: "Texto da escala:\\n\\n" + textoLimitado }
      ]
    })
  });
  if(!response.ok){
    const errBody = await response.text().catch(()=> '');
    throw new Error('Falha ao consultar a IA (status ' + response.status + '). Verifique se a chave de API está correta. ' + errBody.slice(0,200));
  }
  const data = await response.json();
  const textBlock = (data.content || []).find(c => c.type === 'text');
  if(!textBlock) throw new Error('Resposta da IA vazia.');
  let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  let parsed;
  try{ parsed = JSON.parse(clean); }
  catch(e){ throw new Error('Não foi possível interpretar a resposta da IA.'); }
  return (parsed.eventos || []);
}

function confirmarImportacao(){
  const selecionados = state.importFlow.extracted.filter(x => x.incluir !== false);
  if(!selecionados.length){ showToast('Nenhum evento selecionado.'); return; }
  selecionados.forEach(item => {
    state.eventos.push({
      id: uid(),
      nome: state.perfil.nome,
      data: item.data || null,
      diaSemana: item.data ? diaDaSemana(item.data) : null,
      horario: item.horario || null,
      funcao: item.funcao || null,
      local: item.local || null,
      observacoes: item.observacoes || null,
      origem: 'importado',
      incompleto: !!item.incompleto,
      criadoEm: new Date().toISOString()
    });
  });
  saveEventos();
  state.importFlow.step = 'concluido';
  render();
}

/* ================= DRAG & DROP ================= */
document.addEventListener('dragover', e => {
  if(e.target.closest && e.target.closest('#dropzone')){ e.preventDefault(); e.target.closest('#dropzone').classList.add('drag'); }
});
document.addEventListener('dragleave', e => {
  if(e.target.closest && e.target.closest('#dropzone')){ e.target.closest('#dropzone').classList.remove('drag'); }
});
document.addEventListener('drop', e => {
  const dz = e.target.closest && e.target.closest('#dropzone');
  if(dz){
    e.preventDefault();
    dz.classList.remove('drag');
    if(e.dataTransfer.files[0]) onFileSelected(e.dataTransfer.files[0]);
  }
});

/* ================= RENDER ROOT ================= */
function render(){
  const root = document.getElementById('root');
  let pageHtml = '';
  if(!state.loaded){
    root.innerHTML = `<div class="page"><div class="empty-state">Carregando...</div></div>`;
    return;
  }
  if(state.page === 'inicio') pageHtml = renderInicio();
  else if(state.page === 'minhaescala') pageHtml = renderMinhaEscala();
  else if(state.page === 'calendario') pageHtml = renderCalendario();
  else if(state.page === 'adicionar') pageHtml = renderAdicionar();
  else if(state.page === 'importar') pageHtml = renderImportar();

  root.innerHTML = renderTopbar() + pageHtml + (state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : '');
}

loadData();
